[project]
name = "searxng-mcp"
version = "0.1.0"
description = "MCP server wrapping local SearXNG/Vane instance"
requires-python = ">=3.10"
dependencies = ["mcp[cli]>=1.0.0"]

[project.scripts]
searxng-mcp = "searxng_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["searxng_mcp"]
